<!-- AppLayout -->
<div class="lg:flex min-h-screen bg-pageBackground">

  <!-- AppNav (adminNavItems) -->
  <aside class="hidden h-screen w-64 shrink-0 lg:flex">
    <div class="fixed hidden h-screen w-60 shrink-0 flex-col border-r border-borderDividers bg-surfaceSideBar p-4 lg:flex">
      <img src="../frontend/src/assets/sixtStudentsLogo.png" width="244" height="122" alt="Sixt Students" />
      <nav class="mt-6 w-full flex-1">
        <ul class="flex flex-col text-primaryText font-semibold">
          <li class="w-full"><a href="#" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors hover:text-primaryText text-secondaryText"><svg class="i size-6 shrink-0 ml-4"><use href="#i-home"/></svg><span>Dashboard</span></a></li>
          <li class="w-full"><a href="#" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors hover:text-primaryText text-secondaryText"><svg class="i size-6 shrink-0 ml-4"><use href="#i-calendar"/></svg><span>Schedule</span></a></li>
          <li class="w-full"><a href="#" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors hover:text-primaryText text-secondaryText"><svg class="i size-6 shrink-0 ml-4"><use href="#i-users"/></svg><span>Students</span></a></li>
          <li class="w-full"><a href="#" aria-current="page" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors border-primary border-l-6 bg-primary/10 text-primary"><svg class="i size-6 shrink-0 ml-4"><use href="#i-banknotes"/></svg><span>Earnings</span></a></li>
          <li class="w-full"><a href="#" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors hover:text-primaryText text-secondaryText"><svg class="i size-6 shrink-0 ml-4"><use href="#i-cog"/></svg><span>Settings</span></a></li>
          <li class="w-full"><a href="#" class="flex flex-1 items-center gap-4 rounded-l p-4 text-xl transition-colors hover:text-primaryText text-secondaryText"><svg class="i size-6 shrink-0 ml-4"><use href="#i-document"/></svg><span>Contracts</span></a></li>
        </ul>
      </nav>
      <div class="flex flex-col items-center justify-end w-full">
        <hr class="border-borderDividers border-2 w-full" />
        <button type="button" class="text-secondaryText font-semibold px-8 py-4 mt-2 flex items-center justify-center gap-4 cursor-pointer hover:text-primaryText transition-colors rounded-lg hover:bg-cardBG w-full">
          <svg class="i size-6 shrink-0"><use href="#i-logout"/></svg><span class="text-xl">Logout</span>
        </button>
      </div>
    </div>
  </aside>

  <!-- MobileAppNav top bar -->
  <header class="sticky top-0 z-50 bg-surfaceSideBar lg:hidden">
    <div class="flex h-18 items-center justify-between border-b border-borderDividers px-4">
      <img src="../frontend/src/assets/sixtStudentsLogo.png" alt="Sixt Students App" class="h-auto w-33" />
      <button type="button" aria-label="Open menu" class="flex size-11 items-center justify-center rounded-lg border border-borderDividers bg-cardBG text-primaryText">
        <svg class="i size-6"><use href="#i-bars"/></svg>
      </button>
    </div>
  </header>

  <main class="min-w-0 flex-1 p-4 lg:p-6">
    <div class="mx-auto max-w-5xl">

      <div class="text-primaryText font-semibold flex flex-col">
        <h1 class="text-2xl md:text-3xl">Earnings</h1>
        <p class="text-base md:text-xl text-secondaryText font-semibold">What you owe your students, month by month</p>
      </div>

      <!-- Page tabs: payroll is the admin's job, the race is a separate view of the same month -->
      <div id="tabs" role="tablist" aria-label="Earnings views" class="mt-8 flex gap-6 border-b border-borderDividers"></div>

      <!-- Same layout as AdminContractsPageContent: PeriodBar, then that month's content -->
      <div class="mt-6 flex flex-col gap-4">
        <div id="period-bar"></div>

        <!-- Payroll tab: "what do I owe, to whom, am I on budget, and can I pay it?" -->
        <section id="payout" role="tabpanel" aria-labelledby="tab-payroll" class="rounded-xl border border-borderDividers bg-cardBG"></section>

        <!-- Race tab: Race + Podium from the student earnings page, in the admin card style -->
        <div id="panel-race" role="tabpanel" aria-labelledby="tab-race" class="hidden grid-cols-1 gap-4 md:grid-cols-3">
          <section id="race" class="md:col-span-2 flex flex-col rounded-xl border border-borderDividers bg-cardBG p-6 text-primaryText"></section>
          <section id="podium" class="flex flex-col rounded-xl border border-borderDividers bg-cardBG p-6 text-primaryText"></section>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
  // ---------- Mock data ----------
  // Pretend today is 10 November 2026. Budget would be one number the admin sets in Settings.
  const MONTHLY_BUDGET = 8000;
  const RATES = {
    "Ana Perić": 12, "Marko Kovač": 12, "Lucija Horvat": 13, "Fran Šipek": 12, "Ivan Babić": 12,
    "Petra Novak": 10.5, "Luka Jurić": 12, "Josip Knežević": 10.5, "Sara Marić": 12, "Ema Pavlović": 12,
    "Karlo Vuković": 12, "Dino Matić": 12, "Mia Tomić": 10.5, "Nika Božić": 13,
  };

  // hours = hours worked in that month
  const months = [
    {
      key: "2026-09", name: "September", year: 2026, state: "paid", paidOn: "3 Oct",
      hours: { "Ana Perić": 72, "Marko Kovač": 64, "Lucija Horvat": 72, "Fran Šipek": 56, "Ivan Babić": 48, "Petra Novak": 56, "Luka Jurić": 56, "Josip Knežević": 40, "Sara Marić": 48, "Ema Pavlović": 32, "Karlo Vuković": 40, "Dino Matić": 32, "Mia Tomić": 24 },
      missing: [],
    },
    {
      key: "2026-10", name: "October", year: 2026, state: "ended",
      hours: { "Ana Perić": 80, "Marko Kovač": 72, "Lucija Horvat": 64, "Fran Šipek": 64, "Ivan Babić": 56, "Petra Novak": 64, "Luka Jurić": 48, "Josip Knežević": 48, "Sara Marić": 40, "Ema Pavlović": 40, "Karlo Vuković": 32, "Dino Matić": 24, "Mia Tomić": 24, "Nika Božić": 16 },
      missing: ["Ivan Babić", "Sara Marić"],
    },
    {
      key: "2026-11", name: "November", year: 2026, state: "current", daysLeft: 20,
      hours: { "Ana Perić": 32, "Marko Kovač": 32, "Lucija Horvat": 32, "Fran Šipek": 24, "Ivan Babić": 24, "Petra Novak": 24, "Luka Jurić": 16, "Josip Knežević": 16, "Sara Marić": 16, "Ema Pavlović": 8, "Karlo Vuković": 16, "Mia Tomić": 8, "Nika Božić": 8 },
      // approved shifts still to come this month
      scheduled: { cost: 4804, shifts: 51 },
      missing: ["Ivan Babić", "Sara Marić", "Mia Tomić"],
    },
  ];

  // ---------- Helpers ----------
  // same as helpers/formatStat.ts
  const formatStat = (n, unit = "") => n.toLocaleString("en-US", { maximumFractionDigits: 1 }) + unit;
  const icon = (name, cls) => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const listNames = (names) => names.length < 2 ? names.join("") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`;

  function rowsFor(month) {
    return Object.entries(month.hours)
      .map(([name, hours]) => ({ name, hours, rate: RATES[name], amount: hours * RATES[name], hasContract: !month.missing.includes(name) }))
      .sort((a, b) => a.name.localeCompare(b.name, "hr"));
  }

  function totalsFor(month) {
    const rows = rowsFor(month);
    return {
      rows,
      amount: rows.reduce((sum, r) => sum + r.amount, 0),
      hours: rows.reduce((sum, r) => sum + r.hours, 0),
    };
  }

  // open the month that needs action: the oldest finished month that isn't paid, else the current one
  const current = months.findIndex((m) => m.state === "current");
  let selected = months.findIndex((m) => m.state === "ended");
  if (selected === -1) selected = current;
  const reminded = new Set(); // "monthKey|name"
  let isPickerOpen = false;
  let tab = "payroll";

  // ---------- Page tabs ----------
  function renderTabs() {
    const tabButton = (id, label, iconName, panelId) => {
      const active = tab === id;
      return `<button type="button" role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${active}" aria-controls="${panelId}"
        class="-mb-px flex items-center gap-2 border-b-2 px-1 pb-3 text-base font-semibold cursor-pointer transition-colors ${active ? "border-primary text-primaryText" : "border-transparent text-secondaryText hover:text-primaryText"}">
        ${icon(iconName, `size-5 ${active ? "text-primary" : ""}`)}${label}
      </button>`;
    };
    document.getElementById("tabs").innerHTML =
      tabButton("payroll", "Payroll", "banknotes", "payout") + tabButton("race", "Race", "trophy", "panel-race");
    document.getElementById("payout").classList.toggle("hidden", tab !== "payroll");
    document.getElementById("panel-race").classList.toggle("hidden", tab !== "race");
    document.getElementById("panel-race").classList.toggle("grid", tab === "race");
  }

  const MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

  // ---------- PeriodBar + MonthPickerPopover (same markup as components/PeriodBar, label passed in) ----------
  function renderPeriodBar() {
    const month = months[selected];
    const isCurrentMonth = selected === current;
    const navBtn = "flex size-9 shrink-0 items-center justify-center rounded-lg border border-borderDividers text-icons cursor-pointer transition-colors hover:bg-borderDividers disabled:cursor-not-allowed disabled:opacity-30";
    const yearBtn = "flex size-8 items-center justify-center rounded-lg border border-borderDividers text-icons cursor-pointer hover:bg-borderDividers disabled:cursor-not-allowed disabled:opacity-30";

    // months without payroll data are disabled, like isMonthSelectable does in the real picker
    const popover = !isPickerOpen ? "" : `
      <div class="absolute left-1/2 top-full z-20 mt-2 w-72 -translate-x-1/2 rounded-xl border border-surfaceCards bg-cardLighterBG p-3 shadow-lg" role="dialog" aria-label="Choose a month">
        <div class="flex items-center justify-between">
          <button type="button" aria-label="Previous year" disabled class="${yearBtn}">${icon("chevron-left", "size-4")}</button>
          <span class="text-sm font-semibold text-primaryText">${month.year}</span>
          <button type="button" aria-label="Next year" disabled class="${yearBtn}">${icon("chevron-right", "size-4")}</button>
        </div>
        <div class="mt-3 grid grid-cols-3 gap-1.5">
          ${MONTH_NAMES.map((name) => {
            const index = months.findIndex((m) => m.year === month.year && m.name === name);
            const style = index === selected
              ? "border-primary bg-primary/10 text-primary"
              : "border-transparent text-primaryText enabled:hover:bg-darkBackground";
            return `<button type="button" data-pick="${index}" ${index === -1 ? "disabled" : ""} class="h-9 rounded-lg border text-sm cursor-pointer transition-colors disabled:cursor-not-allowed disabled:text-surfaceCards ${style}">${name.slice(0, 3)}</button>`;
          }).join("")}
        </div>
        ${isCurrentMonth ? "" : `
          <div class="mt-3 flex justify-end border-t border-borderDividers pt-2">
            <button type="button" data-pick="${current}" class="text-xs font-semibold text-primary cursor-pointer hover:underline">This month</button>
          </div>`}
      </div>`;

    document.getElementById("period-bar").innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-borderDividers bg-cardBG px-3 py-2.5">
        <div class="flex items-center gap-2 text-sm text-secondaryText">
          <span>Showing ${tab === "race" ? "race" : "payroll"} for</span>
          ${isCurrentMonth
            ? `<span class="rounded-full border border-success/30 bg-success/10 px-2 py-0.5 text-xs text-success">Current month</span>`
            : `<span class="rounded-full border border-borderDividers px-2 py-0.5 text-xs">Past month</span>`}
        </div>
        <div class="flex w-full items-center gap-2 sm:w-auto">
          <button type="button" data-step="-1" aria-label="Previous month" ${selected === 0 ? "disabled" : ""} class="${navBtn}">${icon("chevron-left", "size-5")}</button>
          <div id="picker" class="relative flex-1 sm:flex-none">
            <button type="button" data-toggle-picker aria-haspopup="dialog" aria-expanded="${isPickerOpen}" class="flex h-9 w-full items-center justify-center gap-2 rounded-lg border border-borderDividers bg-cardLighterBG px-3 text-sm font-semibold text-primaryText cursor-pointer transition-colors hover:border-primary/50 sm:w-48">
              ${icon("calendar", "size-4 text-primary")}${month.name} ${month.year}${icon("chevron-down", "size-4 text-secondaryText")}
            </button>
            ${popover}
          </div>
          <button type="button" data-step="1" aria-label="Next month" ${selected === months.length - 1 ? "disabled" : ""} class="${navBtn}">${icon("chevron-right", "size-5")}</button>
        </div>
      </div>`;
  }

  // ---------- Payout card ----------
  // one neutral pill for every status; only the dot carries colour (same idea as ContractStatusBadge)
  function statusChip(month) {
    const chip = (dot, text) => `<span class="inline-flex items-center gap-1.5 rounded-full border border-borderDividers bg-cardLighterBG px-2.5 py-0.5 text-xs font-semibold text-primaryText"><span class="size-2 rounded-full ${dot}"></span>${text}</span>`;
    if (month.state === "paid") return chip("bg-success", `Paid on ${month.paidOn}`);
    if (month.state === "current") return chip("bg-pending", `In progress · ${month.daysLeft} days left`);
    if (month.missing.length) return chip("bg-warning", `Waiting on ${month.missing.length} ${month.missing.length === 1 ? "contract" : "contracts"}`);
    return chip("bg-primary", "Ready to pay");
  }

  function actions(month) {
    const exportBtn = `<button type="button" data-export class="flex h-10 items-center justify-center gap-2 rounded-lg border border-borderDividers px-4 text-sm font-semibold text-primaryText cursor-pointer transition-colors hover:border-primary hover:text-primary">${icon("download", "size-4")}Export CSV</button>`;
    if (month.state === "ended") {
      return exportBtn + `<button type="button" data-mark-paid class="flex h-10 items-center justify-center gap-2 rounded-lg bg-primary px-4 text-sm font-semibold text-white cursor-pointer transition-colors hover:bg-primary/80">${icon("check", "size-4")}Mark as paid</button>`;
    }
    if (month.state === "paid" && month.paidHere) {
      return `<button type="button" data-undo-paid class="h-10 px-2 text-sm font-semibold text-secondaryText cursor-pointer hover:text-primaryText">Undo</button>` + exportBtn;
    }
    return exportBtn;
  }

  // budget line: finished months compare what was earned, the current month what it's expected to end at
  function budgetBlock(month, earned) {
    const isCurrent = month.state === "current";
    const scheduled = isCurrent ? month.scheduled.cost : 0;
    const expected = earned + scheduled;
    const diff = MONTHLY_BUDGET - expected;
    const scale = Math.max(expected, MONTHLY_BUDGET) * 1.05;
    const pct = (v) => `${(v / scale) * 100}%`;
    const verdictText = diff >= 0
      ? `${isCurrent ? "On track, " : ""}${formatStat(diff, "€")} under budget`
      : `${isCurrent ? "Heading " : ""}${formatStat(-diff, "€")} over budget`;
    const verdict = `<span class="flex items-center gap-2 font-semibold text-primaryText"><span class="size-2 rounded-full ${diff >= 0 ? "bg-success" : "bg-warning"}"></span>${verdictText}</span>`;

    return `
      <div class="mt-6">
        <div class="mb-2 flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1 text-sm">
          ${verdict}
          ${isCurrent ? `<span class="text-secondaryText">Expected to end at <span class="font-semibold text-primaryText tabular-nums">${formatStat(expected, "€")}</span></span>` : ""}
        </div>
        <div class="relative h-2 rounded-full bg-darkBackground" role="img"
             aria-label="${formatStat(earned, "€")} worked${isCurrent ? `, ${formatStat(scheduled, "€")} in approved shifts to come` : ""}, budget ${formatStat(MONTHLY_BUDGET, "€")}">
          <div class="absolute inset-y-0 left-0 rounded-l-full bg-primary" style="width:${pct(earned)}"></div>
          ${isCurrent ? `<div class="absolute inset-y-0 bg-primary/35" style="left:${pct(earned)}; width:${pct(scheduled)}"></div>` : ""}
          <div class="absolute -inset-y-1.5 w-0.5 -translate-x-1/2 rounded-full bg-primaryText" style="left:${pct(MONTHLY_BUDGET)}"></div>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-x-5 gap-y-1 text-sm text-secondaryText">
          <span class="flex items-center gap-2"><span class="size-2.5 rounded-full bg-primary"></span>Worked</span>
          ${isCurrent ? `<span class="flex items-center gap-2"><span class="size-2.5 rounded-full bg-primary/35"></span>Scheduled, ${month.scheduled.shifts} shifts</span>` : ""}
          <span class="flex items-center gap-2"><span class="h-3 w-0.5 rounded-full bg-primaryText"></span>Budget ${formatStat(MONTHLY_BUDGET, "€")}</span>
          <a href="#" class="ml-auto font-semibold hover:text-primaryText">Change budget</a>
        </div>
      </div>`;
  }

  function contractCell(month, r) {
    // the normal case stays quiet; only a missing contract gets colour
    if (r.hasContract) {
      return `<span class="inline-flex items-center gap-1.5 text-sm text-secondaryText">${icon("check", "size-4 text-success")}Uploaded</span>`;
    }
    const sent = reminded.has(`${month.key}|${r.name}`);
    return `<span class="inline-flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
      <span class="inline-flex items-center gap-1.5 font-semibold text-warning">${icon("warning", "size-4")}Missing</span>
      ${sent
        ? `<span class="text-secondaryText">Reminder sent</span>`
        : `<button type="button" data-remind="${r.name}" class="rounded-md border border-borderDividers px-2 py-0.5 text-xs font-semibold text-primaryText cursor-pointer transition-colors hover:border-primary hover:text-primary">Remind</button>`}
    </span>`;
  }

  function missingNotice(month) {
    if (!month.missing.length || month.state === "paid") return "";
    const n = month.missing.length;
    const allSent = month.missing.every((name) => reminded.has(`${month.key}|${name}`));
    const advice = month.state === "ended" ? " Remind them before you pay." : "";
    return `
      <div class="mt-5 flex flex-col gap-3 rounded-lg border border-borderDividers bg-cardLighterBG p-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex gap-3">
          ${icon("warning", "mt-0.5 size-5 shrink-0 text-warning")}
          <p class="text-sm text-secondaryText"><span class="font-semibold text-primaryText">${n} ${n === 1 ? "contract" : "contracts"} missing.</span>
            ${listNames(month.missing)} ${n === 1 ? "hasn't" : "haven't"} uploaded their ${month.name} contract yet.${advice}</p>
        </div>
        ${allSent
          ? `<span class="flex shrink-0 items-center gap-1.5 text-sm font-semibold text-secondaryText">${icon("check", "size-4 text-success")}Reminders sent</span>`
          : `<button type="button" data-remind-all class="flex h-9 shrink-0 items-center justify-center gap-2 whitespace-nowrap rounded-lg border border-borderDividers px-3 text-sm font-semibold text-primaryText cursor-pointer transition-colors hover:border-primary hover:text-primary">${icon("envelope", "size-4")}Remind ${n === 2 ? "both" : n === 1 ? "them" : `all ${n}`}</button>`}
      </div>`;
  }

  function renderPayout() {
    const month = months[selected];
    const { rows, amount, hours } = totalsFor(month);
    const uploaded = rows.filter((r) => r.hasContract).length;
    const totalLabel = { ended: "To pay", paid: "Paid", current: "Earned so far" }[month.state];

    document.getElementById("payout").innerHTML = `
      <div class="p-5">
        <div class="flex flex-col gap-4 md:flex-row md:items-start md:justify-between">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h2 class="text-sm font-medium text-secondaryText">${totalLabel}</h2>
              ${statusChip(month)}
            </div>
            <p class="mt-1 text-4xl font-semibold tabular-nums">${formatStat(amount, "€")}</p>
            <p class="mt-1 text-sm text-secondaryText tabular-nums">${formatStat(hours, " hours")} · ${rows.length} students</p>
            ${month.state === "current" ? `<p class="mt-1 text-sm text-secondaryText">You can mark ${month.name} as paid once the month ends.</p>` : ""}
          </div>
          <div class="flex gap-2 [&>button]:flex-1 md:[&>button]:flex-none">${actions(month)}</div>
        </div>
        ${budgetBlock(month, amount)}
        ${missingNotice(month)}
      </div>

      <!-- Desktop table -->
      <table class="hidden w-full text-left md:table">
        <caption class="sr-only">${month.name} ${month.year} payout by student</caption>
        <thead>
          <tr class="border-y border-borderDividers text-sm text-secondaryText">
            <th scope="col" class="py-3 pl-5 pr-4 font-medium">Student</th>
            <th scope="col" class="py-3 pr-4 text-right font-medium">Hours</th>
            <th scope="col" class="py-3 pr-4 text-right font-medium">Rate</th>
            <th scope="col" class="py-3 pr-4 text-right font-medium">Amount</th>
            <th scope="col" class="py-3 pl-8 pr-5 font-medium">Contract</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r) => `
            <tr class="border-b border-borderDividers">
              <th scope="row" class="py-3.5 pl-5 pr-4 text-left font-semibold"><a href="#" class="hover:text-primary">${r.name}</a></th>
              <td class="py-3.5 pr-4 text-right tabular-nums">${formatStat(r.hours, "h")}</td>
              <td class="py-3.5 pr-4 text-right tabular-nums text-secondaryText">${formatStat(r.rate, "€")}/h</td>
              <td class="py-3.5 pr-4 text-right font-semibold tabular-nums">${formatStat(r.amount, "€")}</td>
              <td class="py-3.5 pl-8 pr-5">${contractCell(month, r)}</td>
            </tr>`).join("")}
        </tbody>
        <tfoot>
          <tr class="font-semibold">
            <th scope="row" class="py-4 pl-5 pr-4 text-left">Total</th>
            <td class="py-4 pr-4 text-right tabular-nums">${formatStat(hours, "h")}</td>
            <td></td>
            <td class="py-4 pr-4 text-right tabular-nums">${formatStat(amount, "€")}</td>
            <td class="py-4 pl-8 pr-5 text-sm font-normal text-secondaryText">${uploaded} of ${rows.length} uploaded</td>
          </tr>
        </tfoot>
      </table>

      <!-- Mobile list: amount on the right, contract only when something is wrong -->
      <ul class="border-t border-borderDividers md:hidden">
        ${rows.map((r) => `
          <li class="flex items-start justify-between gap-4 border-b border-borderDividers px-5 py-3.5">
            <div class="min-w-0">
              <p class="font-semibold">${r.name}</p>
              <p class="text-sm text-secondaryText tabular-nums">${formatStat(r.hours, "h")} × ${formatStat(r.rate, "€")}/h</p>
              ${r.hasContract ? "" : `<div class="mt-1">${contractCell(month, r)}</div>`}
            </div>
            <p class="font-semibold tabular-nums">${formatStat(r.amount, "€")}</p>
          </li>`).join("")}
        <li class="flex justify-between px-5 py-4 font-semibold">
          <span>Total</span><span class="tabular-nums">${formatStat(amount, "€")}</span>
        </li>
      </ul>`;
  }

  // ---------- Race + Podium (same markup as components/student/RacePage) ----------
  const RACE_MAX_STUDENTS_TO_DISPLAY = 5;
  let raceMode = "hours";

  // what GET /me/race returns for a month: worked hours and shifts per student
  function raceStatsFor(month) {
    return Object.entries(month.hours)
      .map(([name, hours]) => ({ name, hours_worked: hours, shifts_worked: hours / 8 }))
      .sort((a, b) => b.hours_worked - a.hours_worked || a.name.localeCompare(b.name, "hr"));
  }

  // components/student/RacePage/Race/Car.tsx
  const car = (cls, left) => `
    <svg viewBox="0 0 60 22" class="h-5 w-14 ${cls}" style="left:${left}%" aria-hidden="true">
      <path d="M5 11 L6 6.8 M1.5 6.6 L10.5 6.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      <path d="M2 16 L2 11.5 L10 10.5 C16 9.5 19 5 26 4.6 C32 4.4 36 7 40 9 L54 11.5 Q58 12.5 58 15 L58 16 Z" fill="currentColor" />
      <path d="M19.5 8.8 C22 6.2 25 5.6 28 5.6 C31.5 5.6 34 7 36 8.8 Z" class="fill-pageBackground" opacity="0.55" />
      <path d="M14 12.6 L50 13.2" class="stroke-pageBackground" stroke-width="1" opacity="0.35" />
      <path d="M53 11.8 L56.5 12.6" class="stroke-primaryText" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
      <circle cx="14" cy="16.5" r="4.6" class="fill-pageBackground" stroke="currentColor" stroke-width="1.6" />
      <circle cx="14" cy="16.5" r="1.4" fill="currentColor" />
      <circle cx="47" cy="16.5" r="4.6" class="fill-pageBackground" stroke="currentColor" stroke-width="1.6" />
      <circle cx="47" cy="16.5" r="1.4" fill="currentColor" />
    </svg>`;

  // RacingLine without a current user: an admin is never in the standings, so no "You" highlight
  const racingLine = (position, name, value, maxValue, suffix) => {
    const percentage = (value / maxValue) * 100;
    return `
      <li class="grid grid-cols-[1.5rem_minmax(0,1fr)_auto] items-center gap-x-3 gap-y-1.5 sm:flex sm:gap-3">
        <span class="w-6 shrink-0 text-secondaryText">${position}</span>
        <span class="min-w-0 truncate font-semibold sm:w-28 sm:shrink-0">${name}</span>
        <div class="relative order-last col-span-3 h-7 bg-cardLighterBG rounded-lg overflow-hidden sm:order-0 sm:h-8 sm:flex-1">
          <div class="absolute left-0 right-3 top-1/2 border-t-2 border-dashed border-icons/40"></div>
          <div class="absolute inset-y-0 right-0 w-3 bg-[repeating-conic-gradient(var(--color-primaryText)_0_25%,var(--color-darkBackground)_0_50%)] bg-size-[6px_6px] opacity-60"></div>
          <div class="h-full bg-surfaceCards/70" style="width:${percentage}%"></div>
          ${car(`absolute top-1/2 -translate-x-full -translate-y-1/2 ${position === 1 ? "text-primary" : "text-secondaryText"}`, percentage)}
        </div>
        <span class="shrink-0 text-right font-bold sm:w-14">${value}${suffix}</span>
      </li>`;
  };

  function renderRace() {
    const stats = raceStatsFor(months[selected]);
    const key = raceMode === "hours" ? "hours_worked" : "shifts_worked";
    const sorted = stats.toSorted((a, b) => b[key] - a[key]);
    const maxValue = Math.max(...stats.map((s) => s[key]));
    // same segmented control as AdminHoursPayrollChart's Hours/Payroll switch
    const modeBtn = (mode, label) => `<button type="button" data-race-mode="${mode}" aria-pressed="${raceMode === mode}" class="h-8 rounded-md px-3.5 text-sm font-semibold cursor-pointer ${raceMode === mode ? "bg-darkBackground text-primaryText" : "text-secondaryText hover:text-primaryText"}">${label}</button>`;

    document.getElementById("race").innerHTML = `
      <div class="flex flex-col sm:flex-row gap-4 justify-between items-center">
        <div class="flex flex-col text-primaryText">
          <h2 class="text-xl font-bold">This race</h2>
          <p class="text-sm text-secondaryText font-semibold">Hours or number of shifts worked in a selected month. The leader sets the finish line.</p>
        </div>
        <div role="group" aria-label="Race by" class="flex shrink-0 rounded-lg border border-borderDividers bg-surfaceSideBar p-0.5">${modeBtn("hours", "Hours")}${modeBtn("shifts", "Shifts")}</div>
      </div>
      <ul class="flex flex-col gap-4 mt-6">
        ${sorted.slice(0, RACE_MAX_STUDENTS_TO_DISPLAY)
          .map((s, i) => racingLine(i + 1, s.name, s[key], maxValue, raceMode === "hours" ? "h" : ""))
          .join("")}
      </ul>`;
  }

  // app palette only: the winner gets the brand orange, 2nd and 3rd step down in greys
  const PLACE_STYLES = [
    { order: "order-2", height: "h-40", block: "bg-primary text-white", trophy: "text-primary size-12" },
    { order: "order-1", height: "h-28", block: "bg-surfaceCards", trophy: "text-primaryText size-10" },
    { order: "order-3", height: "h-20", block: "bg-darkBackground", trophy: "text-secondaryText size-8" },
  ];

  function renderPodium() {
    const month = months[selected];
    const top3 = raceStatsFor(month).slice(0, 3);

    document.getElementById("podium").innerHTML = `
      <div class="flex flex-col sm:flex-row justify-between sm:gap-4">
        <h3 class="text-primaryText text-left font-semibold">Podium</h3>
        <p class="text-sm text-secondaryText sm:text-right font-semibold">Top performers ${month.name.slice(0, 3)} ${month.year}</p>
      </div>
      <div class="flex flex-row w-full flex-1 items-end min-h-92 overflow-hidden justify-between gap-2">
        ${top3.map((racer, i) => {
          const style = PLACE_STYLES[i];
          return `
            <div class="flex flex-col items-center gap-1 flex-1 ${style.order}">
              ${icon("trophy", style.trophy)}
              <span class="truncate text-sm font-bold text-wrap text-center">${racer.name}</span>
              <span class="text-secondaryText font-bold text-sm">${racer.hours_worked}h</span>
              <div class="flex w-full justify-center rounded-t-lg pt-2 text-2xl font-bold ${style.height} ${style.block}">${i + 1}</div>
            </div>`;
        }).join("")}
      </div>`;
  }

  function render() {
    renderTabs();
    renderPeriodBar();
    renderPayout();
    renderRace();
    renderPodium();
  }

  // ---------- Interactions ----------
  document.addEventListener("click", (e) => {
    const target = e.target.closest("button");
    if (!target) return;
    const month = months[selected];
    const data = target.dataset;

    if (data.step) {
      selected += Number(data.step);
      isPickerOpen = false;
    } else if ("togglePicker" in data) {
      isPickerOpen = !isPickerOpen;
    } else if (data.pick !== undefined) {
      selected = Number(data.pick);
      isPickerOpen = false;
    } else if (data.remind) {
      reminded.add(`${month.key}|${data.remind}`);
    } else if ("remindAll" in data) {
      month.missing.forEach((name) => reminded.add(`${month.key}|${name}`));
    } else if ("markPaid" in data) {
      Object.assign(month, { state: "paid", paidOn: "10 Nov", paidHere: true });
    } else if ("undoPaid" in data) {
      Object.assign(month, { state: "ended", paidHere: false });
    } else if (data.tab) {
      tab = data.tab;
      isPickerOpen = false;
    } else if (data.raceMode) {
      raceMode = data.raceMode;
    } else if ("export" in data) {
      exportCsv(month);
      return;
    } else {
      return;
    }
    render();
  });

  // close the picker on an outside click or Escape, like PeriodBar does
  document.addEventListener("mousedown", (e) => {
    if (isPickerOpen && !e.target.closest("#picker")) {
      isPickerOpen = false;
      renderPeriodBar();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (isPickerOpen && e.key === "Escape") {
      isPickerOpen = false;
      renderPeriodBar();
    }
  });

  // BOM so Excel reads č/ć/š correctly
  function exportCsv(month) {
    const { rows, amount, hours } = totalsFor(month);
    const lines = [
      ["Student", "Hours", "Hourly rate (EUR)", "Amount (EUR)", "Contract"],
      ...rows.map((r) => [r.name, r.hours, r.rate.toFixed(2), r.amount.toFixed(2), r.hasContract ? "Uploaded" : "Missing"]),
      ["Total", hours, "", amount.toFixed(2), ""],
    ];
    const csv = lines.map((line) => line.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    const link = Object.assign(document.createElement("a"), { href: url, download: `payroll-${month.key}.csv` });
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  render();
</script>
</body>
</html>
