services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentsapp
    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/db:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: studentsapp
      DATABASE_URL: postgres://postgres:postgres@db:5432/studentsapp
      RESEND_API_KEY: ${RESEND_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
